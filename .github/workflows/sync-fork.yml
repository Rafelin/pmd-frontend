name: Sync Fork from Upstream

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/Augusto-pmd/pmd-frontend.git || true
          git fetch upstream

      - name: Merge upstream into fork
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git checkout main
          # Excluir workflows del merge
          git merge upstream/main --no-edit -X theirs --no-commit || true
          # Restaurar workflows del fork
          git checkout HEAD -- .github/workflows/ || true
          git add .github/workflows/
          git commit -m "Sync from upstream (preserving fork workflows)" || echo "No changes to commit"

      - name: Push changes to fork
        run: |
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
