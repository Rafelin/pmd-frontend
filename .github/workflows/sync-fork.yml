name: Sync Fork from Upstream

on:
  schedule:
    # Ejecutar cada hora (ajustar según necesidad)
    - cron: '0 * * * *'
  workflow_dispatch: # Permite ejecución manual desde GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/Augusto-pmd/pmd-frontend.git || true
          git fetch upstream

      - name: Merge upstream into fork
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git checkout main
          git merge upstream/main --no-edit || echo "No changes to merge"

      - name: Push changes to fork
        run: |
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
